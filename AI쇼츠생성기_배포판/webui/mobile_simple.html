<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 영상 생성기 - 모바일</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        input[type="text"] {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        
        .status.show {
            display: block;
        }
        
        .status.loading {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .progress {
            margin-top: 10px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: #667eea;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 유튜브 영상 생성기</h1>
        
        <div class="input-group">
            <label for="title">영상 제목</label>
            <input type="text" id="title" placeholder="예: 건강한 식습관의 중요성" />
        </div>
        
        <div class="input-group">
            <label style="display: flex; align-items: center; cursor: pointer;">
                <input type="checkbox" id="autoUpload" checked style="width: auto; margin-right: 10px;" />
                <span>유튜브 자동 업로드</span>
            </label>
        </div>
        
        <div class="input-group">
            <label style="display: flex; align-items: center; cursor: pointer;">
                <input type="checkbox" id="createGlobal" checked style="width: auto; margin-right: 10px;" />
                <span>🌍 글로벌 버전 생성 (영어)</span>
            </label>
        </div>
        
        <button id="generateBtn" onclick="generateVideo()">
            영상 생성하기
        </button>
        
        <div id="status" class="status">
            <div id="statusText"></div>
            <div class="progress">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>
    </div>
    
    <script>
        let currentTaskId = null;
        let checkInterval = null;
        
        async function generateVideo() {
            const title = document.getElementById('title').value.trim();
            const autoUpload = document.getElementById('autoUpload').checked;
            const createGlobal = document.getElementById('createGlobal').checked;
            
            if (!title) {
                alert('제목을 입력해주세요!');
                return;
            }
            
            const btn = document.getElementById('generateBtn');
            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const progressBar = document.getElementById('progressBar');
            
            // UI 업데이트
            btn.disabled = true;
            btn.textContent = '생성 중...';
            status.className = 'status show loading';
            statusText.textContent = '영상 생성을 시작합니다...';
            progressBar.style.width = '0%';
            
            try {
                // API 호출
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        subject: title,
                        auto_upload: autoUpload,
                        create_global: createGlobal
                    })
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    currentTaskId = data.task_id;
                    statusText.textContent = '영상 생성 중... (0%)';
                    
                    // 진행상황 체크 시작
                    checkInterval = setInterval(checkProgress, 2000);
                } else {
                    throw new Error(data.detail || '영상 생성 실패');
                }
            } catch (error) {
                status.className = 'status show error';
                statusText.textContent = '오류: ' + error.message;
                btn.disabled = false;
                btn.textContent = '영상 생성하기';
            }
        }
        
        async function checkProgress() {
            if (!currentTaskId) return;
            
            try {
                const response = await fetch(`/api/task/${currentTaskId}`);
                const data = await response.json();
                
                const statusText = document.getElementById('statusText');
                const progressBar = document.getElementById('progressBar');
                const status = document.getElementById('status');
                const btn = document.getElementById('generateBtn');
                
                // 진행률 업데이트
                progressBar.style.width = data.progress + '%';
                statusText.textContent = `${data.message} (${data.progress}%)`;
                
                // 완료 체크
                if (data.status === 'complete') {
                    clearInterval(checkInterval);
                    status.className = 'status show success';
                    
                    // 업로드 상태에 따라 메시지 표시
                    let resultMessage = '';
                    
                    if (data.video_id && data.english_video_id) {
                        // 한국어 + 영어 모두 업로드 완료
                        const koreanUrl = `https://youtube.com/watch?v=${data.video_id}`;
                        const englishUrl = `https://youtube.com/watch?v=${data.english_video_id}`;
                        statusText.innerHTML = `✅ 모든 버전 업로드 완료!<br>
                            🇰🇷 <a href="${koreanUrl}" target="_blank" style="color: #667eea; text-decoration: underline;">한국어 버전</a><br>
                            🇺🇸 <a href="${englishUrl}" target="_blank" style="color: #667eea; text-decoration: underline;">영어 버전</a>`;
                        resultMessage = `모든 버전 업로드 완료!\n한국어: ${data.video_id}\n영어: ${data.english_video_id}`;
                    } else if (data.video_id) {
                        // 한국어만 업로드 완료
                        const videoUrl = `https://youtube.com/watch?v=${data.video_id}`;
                        statusText.innerHTML = `✅ 한국어 버전 업로드 완료!<br><a href="${videoUrl}" target="_blank" style="color: #667eea; text-decoration: underline;">유튜브에서 보기</a>`;
                        resultMessage = `한국어 버전 업로드 완료!\nVideo ID: ${data.video_id}`;
                        
                        if (data.english_upload_error) {
                            statusText.innerHTML += `<br>⚠️ 영어 버전 업로드 오류: ${data.english_upload_error}`;
                        }
                    } else if (data.upload_error) {
                        statusText.textContent = `✅ 영상 생성 완료 (업로드 오류: ${data.upload_error})`;
                        resultMessage = `영상 생성 완료 (업로드 오류)`;
                    } else {
                        statusText.textContent = data.message || '✅ 영상 생성 완료!';
                        resultMessage = data.message || '영상 생성 완료!';
                    }
                    
                    progressBar.style.width = '100%';
                    btn.disabled = false;
                    btn.textContent = '영상 생성하기';
                    
                    // 결과 표시
                    if (data.result && data.result.videos) {
                        setTimeout(() => {
                            let message = '영상이 생성되었습니다!\n저장 위치: ' + data.result.videos[0];
                            if (resultMessage) {
                                message += '\n\n' + resultMessage;
                            }
                            alert(message);
                        }, 500);
                    }
                } else if (data.status === 'failed') {
                    clearInterval(checkInterval);
                    status.className = 'status show error';
                    // message 또는 error 필드에서 에러 메시지 가져오기
                    const errorMessage = data.message || data.error || '알 수 없는 오류';
                    statusText.textContent = errorMessage;
                    btn.disabled = false;
                    btn.textContent = '영상 생성하기';
                }
            } catch (error) {
                console.error('진행상황 체크 오류:', error);
            }
        }
    </script>

    <!-- 라이선스 생성 (비밀번호 보호) -->
    <div class="container" style="margin-top: 20px;" id="licenseSection">
        <h1 style="font-size:20px;">🔑 라이선스 생성</h1>
        <div id="licenseLogin">
            <div class="input-group">
                <label>관리자 비밀번호</label>
                <input type="password" id="adminPw" placeholder="비밀번호 입력" onkeydown="if(event.key==='Enter') licenseLogin()"/>
            </div>
            <button onclick="licenseLogin()">로그인</button>
            <div id="loginErr" style="color:#dc3545;margin-top:10px;display:none;">비밀번호가 틀렸습니다</div>
        </div>

        <div id="licenseMain" style="display:none;">
            <div class="input-group">
                <label>고객명</label>
                <input type="text" id="lcName" placeholder="홍길동"/>
            </div>
            <div class="input-group">
                <label>유효 기간</label>
                <select id="lcDays" style="width:100%;padding:15px;border:2px solid #e0e0e0;border-radius:10px;font-size:16px;">
                    <option value="30">30일 (1개월)</option>
                    <option value="90">90일 (3개월)</option>
                    <option value="180">180일 (6개월)</option>
                    <option value="365" selected>365일 (1년)</option>
                    <option value="730">730일 (2년)</option>
                </select>
            </div>
            <div class="input-group">
                <label>메모 (선택)</label>
                <input type="text" id="lcMemo" placeholder="결제 채널, 금액 등"/>
            </div>
            <button onclick="generateLicense()">🔑 라이선스 키 생성</button>

            <div id="lcResult" style="display:none;margin-top:20px;padding:20px;background:#f0f4ff;border-radius:12px;text-align:center;">
                <div style="font-size:13px;color:#666;" id="lcInfo"></div>
                <div id="lcKey" style="font-size:22px;font-weight:bold;color:#667eea;letter-spacing:2px;margin:12px 0;"></div>
                <button onclick="copyLcKey()" style="background:#28a745;">📋 키 복사</button>
            </div>

            <div style="margin-top:24px;">
                <b style="color:#667eea;">생성 기록</b>
                <input type="text" id="lcSearch" placeholder="이름 또는 키 검색..." style="margin-top:8px;" oninput="filterHistory()"/>
                <div id="lcHistory" style="margin-top:10px;max-height:300px;overflow-y:auto;font-size:13px;"></div>
            </div>
        </div>
    </div>

    <script>
    let lcToken = '';
    let lcAllHistory = [];

    async function licenseLogin() {
        const pw = document.getElementById('adminPw').value;
        const res = await fetch('/admin/license/login', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({password: pw})
        });
        const data = await res.json();
        if (data.ok) {
            lcToken = pw;
            document.getElementById('licenseLogin').style.display = 'none';
            document.getElementById('licenseMain').style.display = 'block';
            loadLcHistory();
        } else {
            document.getElementById('loginErr').style.display = 'block';
        }
    }

    async function generateLicense() {
        const res = await fetch('/admin/license/generate', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({
                password: lcToken,
                customer_name: document.getElementById('lcName').value.trim(),
                days: parseInt(document.getElementById('lcDays').value),
                memo: document.getElementById('lcMemo').value.trim()
            })
        });
        const data = await res.json();
        if (data.license_key) {
            document.getElementById('lcKey').textContent = data.license_key;
            document.getElementById('lcInfo').textContent =
                (document.getElementById('lcName').value || '(이름없음)') +
                ' · ' + document.getElementById('lcDays').value + '일 · 만료: ' + data.expiry_date;
            document.getElementById('lcResult').style.display = 'block';
            loadLcHistory();
        }
    }

    function copyLcKey() {
        const key = document.getElementById('lcKey').textContent;
        navigator.clipboard.writeText(key).then(() => alert('복사됨: ' + key));
    }

    async function loadLcHistory() {
        const res = await fetch('/admin/license/history?password=' + lcToken);
        const data = await res.json();
        lcAllHistory = data.licenses.slice().reverse();
        renderHistory(lcAllHistory);
    }

    function filterHistory() {
        const q = document.getElementById('lcSearch').value.toLowerCase();
        const filtered = lcAllHistory.filter(l =>
            (l.customer_name||'').toLowerCase().includes(q) ||
            (l.license_key||'').toLowerCase().includes(q) ||
            (l.memo||'').toLowerCase().includes(q)
        );
        renderHistory(filtered);
    }

    function renderHistory(list) {
        const el = document.getElementById('lcHistory');
        if (list.length === 0) {
            el.innerHTML = '<div style="color:#999;padding:10px 0;">기록 없음</div>';
            return;
        }
        el.innerHTML = list.map(l =>
            `<div style="border-bottom:1px solid #eee;padding:10px 0;display:flex;justify-content:space-between;align-items:flex-start;">
                <div style="flex:1;min-width:0;">
                    <div style="font-weight:bold;color:#333;">${l.customer_name||'(이름없음)'}</div>
                    <div style="color:#667eea;font-weight:bold;letter-spacing:1px;">${l.license_key}</div>
                    <div style="color:#555;">${l.days}일 · 만료: ${l.expiry_date}</div>
                    <div style="color:#999;font-size:12px;">${l.created_at}${l.memo?' · '+l.memo:''}</div>
                </div>
                <div style="display:flex;flex-direction:column;gap:6px;margin-left:8px;flex-shrink:0;">
                    <button onclick="copyHistoryKey('${l.license_key}')"
                        style="width:auto;padding:6px 12px;background:#667eea;font-size:12px;border-radius:6px;">
                        복사
                    </button>
                    <button onclick="deleteLicense('${l.license_key}')"
                        style="width:auto;padding:6px 12px;background:#dc3545;font-size:12px;border-radius:6px;">
                        삭제
                    </button>
                </div>
            </div>`
        ).join('');
    }

    function copyHistoryKey(key) {
        navigator.clipboard.writeText(key).then(() => alert('복사됨: ' + key));
    }

    async function deleteLicense(key) {
        if (!confirm('삭제하시겠습니까?\n' + key)) return;
        await fetch('/admin/license/delete', {
            method: 'POST',
            headers: {'Content-Type':'application/json'},
            body: JSON.stringify({password: lcToken, license_key: key})
        });
        loadLcHistory();
    }
    </script>
</body>
</html>
