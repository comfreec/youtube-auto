<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 영상 생성기 - 모바일</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }
        
        .container {
            max-width: 500px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
        }
        
        h1 {
            text-align: center;
            color: #667eea;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .input-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 600;
        }
        
        input[type="text"], select {
            width: 100%;
            padding: 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }
        
        input[type="text"]:focus, select:focus {
            outline: none;
            border-color: #667eea;
        }
        
        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        
        button:active {
            transform: scale(0.98);
        }
        
        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }
        
        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 10px;
            display: none;
        }
        
        .status.show {
            display: block;
        }
        
        .status.loading {
            background: #fff3cd;
            color: #856404;
        }
        
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        
        .progress {
            margin-top: 10px;
            height: 8px;
            background: #e0e0e0;
            border-radius: 4px;
            overflow: hidden;
        }
        
        .progress-bar {
            height: 100%;
            background: #667eea;
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎬 유튜브 영상 생성기</h1>

        <a id="pcSettingsLink" href="#" target="_blank" rel="noopener noreferrer"
           style="display:none;text-align:center;padding:13px;background:#334155;color:white;text-decoration:none;border-radius:10px;font-weight:700;margin:-12px 0 22px;">
            ⚙️ PC 설정 열기
        </a>

        <details class="input-group">
            <summary style="font-weight:700; cursor:pointer;">🎯 YouTube 영상 참고해 새 영상 만들기</summary>
            <p style="font-size:13px;color:#666;line-height:1.5;">핵심 정보만 참고해 새 제목·새 구성·새 문장으로 작성합니다. 원본 영상과 배경은 복사하지 않습니다.</p>
            <input type="url" id="referenceUrl" placeholder="YouTube 영상 링크" />
            <textarea id="referenceText" rows="4" placeholder="자막을 못 가져올 때 원본 내용을 붙여 넣으세요" style="width:100%;margin-top:8px;box-sizing:border-box;"></textarea>
            <button id="reinterpretBtn" type="button" onclick="reinterpretVideo()" style="margin-top:8px;">🎬 분석하고 새 영상 만들기</button>
            <div id="reinterpretStatus" style="font-size:13px;margin-top:8px;"></div>
        </details>
        
        <div class="input-group">
            <label for="title">영상 제목</label>
            <input type="text" id="title" placeholder="예: 건강한 식습관의 중요성" />
        </div>
        <input type="hidden" id="preparedScript" />
        <input type="hidden" id="preparedTerms" />

        <div class="input-group">
            <label for="videoSource">배경 화면 방식</label>
            <select id="videoSource">
                <option value="stock_auto">🎬 무료 배경 영상 자동 선택</option>
                <option value="ai_image">🖼️ 내용맞춤 AI 이미지 (무료 한도)</option>
                <option value="animation">✨ 간단 애니메이션 (오프라인)</option>
            </select>
            <div style="font-size: 13px; color: #666; margin-top: 7px; line-height: 1.4;">
                AI 이미지가 실패하거나 무료 한도를 모두 사용하면 기존 무료 영상으로 자동 전환됩니다.
            </div>
        </div>

        <div class="input-group">
            <label for="voiceName">한국어 성우</label>
            <select id="voiceName">
                <option value="ko-KR-SunHiNeural">👩 선희 · 밝고 친근한 건강·생활정보</option>
                <option value="ko-KR-InJoonNeural">👨 인준 · 차분하고 묵직한 인생 조언</option>
                <option value="ko-KR-HyunsuMultilingualNeural">👨 현수 · 자연스럽고 중립적인 설명</option>
            </select>
            <div style="font-size:13px;color:#666;margin-top:7px;line-height:1.4;">
                영어 버전 성우는 기존 설정을 그대로 사용합니다.
            </div>
        </div>

        <div class="input-group">
            <label style="display: flex; align-items: center; cursor: pointer;">
                <input type="checkbox" id="autoUpload" checked style="width: auto; margin-right: 10px;" />
                <span>유튜브 자동 업로드</span>
            </label>
        </div>
        
        <div class="input-group">
            <label style="display: flex; align-items: center; cursor: pointer;">
                <input type="checkbox" id="createGlobal" checked style="width: auto; margin-right: 10px;" />
                <span>🌍 글로벌 버전 생성 (영어)</span>
            </label>
        </div>
        
        <button id="generateBtn" onclick="generateVideo()">
            영상 생성하기
        </button>
        
        <div id="status" class="status">
            <div id="statusText"></div>
            <div class="progress">
                <div id="progressBar" class="progress-bar"></div>
            </div>
        </div>
    </div>
    
    <script>
        let currentTaskId = null;
        let checkInterval = null;

        async function loadDefaultVideoSource() {
            try {
                const response = await fetch('/api/settings/video-source', {cache: 'no-store'});
                const data = await response.json();
                const selector = document.getElementById('videoSource');
                if (response.ok && selector.querySelector(`option[value="${data.video_source}"]`)) {
                    selector.value = data.video_source;
                }
                const voiceSelector = document.getElementById('voiceName');
                if (response.ok && voiceSelector.querySelector(`option[value="${data.voice_name}"]`)) {
                    voiceSelector.value = data.voice_name;
                }
            } catch (_) {}
        }

        async function loadPcSettingsLink() {
            try {
                const response = await fetch('/api/settings/mobile-access');
                const data = await response.json();
                if (data.settings_enabled && data.settings_url) {
                    const link = document.getElementById('pcSettingsLink');
                    link.href = data.settings_url;
                    link.style.display = 'block';
                }
            } catch (_) {}
        }

        loadPcSettingsLink();
        loadDefaultVideoSource();
        async function reinterpretVideo() {
            const btn = document.getElementById('reinterpretBtn');
            const status = document.getElementById('reinterpretStatus');
            btn.disabled = true;
            status.textContent = '공개 자막을 분석하고 새 대본을 만드는 중...';
            try {
                const response = await fetch('/api/reinterpret', {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        youtube_url: document.getElementById('referenceUrl').value.trim(),
                        manual_transcript: document.getElementById('referenceText').value.trim()
                    })
                });
                const data = await response.json();
                if (!response.ok) throw new Error(data.detail || '분석 실패');
                document.getElementById('title').value = data.title;
                document.getElementById('preparedScript').value = data.script;
                document.getElementById('preparedTerms').value = JSON.stringify(data.terms || []);
                status.textContent = '✅ 새 대본이 준비되었습니다. 영상 생성을 시작합니다.';
                await generateVideo();
            } catch (error) {
                status.textContent = '❌ ' + error.message;
            } finally {
                btn.disabled = false;
            }
        }
        
        async function generateVideo() {
            const title = document.getElementById('title').value.trim();
            const autoUpload = document.getElementById('autoUpload').checked;
            const createGlobal = document.getElementById('createGlobal').checked;
            const videoSource = document.getElementById('videoSource').value;
            const voiceName = document.getElementById('voiceName').value;
            
            if (!title) {
                alert('제목을 입력해주세요!');
                return;
            }
            
            const btn = document.getElementById('generateBtn');
            const status = document.getElementById('status');
            const statusText = document.getElementById('statusText');
            const progressBar = document.getElementById('progressBar');
            
            // UI 업데이트
            btn.disabled = true;
            btn.textContent = '생성 중...';
            status.className = 'status show loading';
            statusText.textContent = '영상 생성을 시작합니다...';
            progressBar.style.width = '0%';
            
            try {
                const requestBody = {
                    subject: title,
                    script: document.getElementById('preparedScript').value,
                    terms: JSON.parse(document.getElementById('preparedTerms').value || '[]'),
                    auto_upload: autoUpload,
                    create_global: createGlobal,
                    video_source: videoSource,
                    voice_name: voiceName
                };

                const preflightResponse = await fetch('/api/preflight', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(requestBody)
                });
                const preflight = await preflightResponse.json();
                if (!preflightResponse.ok || !preflight.ready) {
                    const problems = (preflight.blocking || []).map(item => item.message).join('\n');
                    throw new Error(problems || preflight.detail || '필수 설정을 확인해주세요.');
                }
                if (preflight.warnings && preflight.warnings.length) {
                    const warnings = preflight.warnings.map(item => item.message).join('\n');
                    if (!confirm(`확인할 항목이 있습니다.\n\n${warnings}\n\n그래도 영상 생성을 계속할까요?`)) {
                        btn.disabled = false;
                        btn.textContent = '영상 생성하기';
                        status.className = 'status';
                        return;
                    }
                }
                // API 호출
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(requestBody)
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    currentTaskId = data.task_id;
                    statusText.textContent = '영상 생성 중... (0%)';
                    
                    // 진행상황 체크 시작
                    checkInterval = setInterval(checkProgress, 2000);
                } else {
                    throw new Error(data.detail || '영상 생성 실패');
                }
            } catch (error) {
                status.className = 'status show error';
                statusText.textContent = '오류: ' + error.message;
                btn.disabled = false;
                btn.textContent = '영상 생성하기';
            }
        }
        
        async function checkProgress() {
            if (!currentTaskId) return;
            
            try {
                const response = await fetch(`/api/task/${currentTaskId}`);
                const data = await response.json();
                
                const statusText = document.getElementById('statusText');
                const progressBar = document.getElementById('progressBar');
                const status = document.getElementById('status');
                const btn = document.getElementById('generateBtn');
                
                // 진행률 업데이트
                progressBar.style.width = data.progress + '%';
                statusText.textContent = `${data.message} (${data.progress}%)`;
                
                // 완료 체크
                if (data.status === 'complete') {
                    clearInterval(checkInterval);
                    status.className = 'status show success';
                    
                    // 업로드 상태에 따라 메시지 표시
                    let resultMessage = '';
                    
                    if (data.video_id && data.english_video_id) {
                        // 한국어 + 영어 모두 업로드 완료
                        const koreanUrl = `https://youtube.com/watch?v=${data.video_id}`;
                        const englishUrl = `https://youtube.com/watch?v=${data.english_video_id}`;
                        statusText.innerHTML = `✅ 모든 버전 업로드 완료!<br>
                            🇰🇷 <a href="${koreanUrl}" target="_blank" style="color: #667eea; text-decoration: underline;">한국어 버전</a><br>
                            🇺🇸 <a href="${englishUrl}" target="_blank" style="color: #667eea; text-decoration: underline;">영어 버전</a>`;
                        resultMessage = `모든 버전 업로드 완료!\n한국어: ${data.video_id}\n영어: ${data.english_video_id}`;
                    } else if (data.video_id) {
                        // 한국어만 업로드 완료
                        const videoUrl = `https://youtube.com/watch?v=${data.video_id}`;
                        statusText.innerHTML = `✅ 한국어 버전 업로드 완료!<br><a href="${videoUrl}" target="_blank" style="color: #667eea; text-decoration: underline;">유튜브에서 보기</a>`;
                        resultMessage = `한국어 버전 업로드 완료!\nVideo ID: ${data.video_id}`;
                        
                        if (data.english_upload_error) {
                            statusText.innerHTML += `<br>⚠️ 영어 버전 업로드 오류: ${data.english_upload_error}`;
                        }
                    } else if (data.upload_error) {
                        statusText.textContent = `✅ 영상 생성 완료 (업로드 오류: ${data.upload_error})`;
                        resultMessage = `영상 생성 완료 (업로드 오류)`;
                    } else {
                        statusText.textContent = data.message || '✅ 영상 생성 완료!';
                        resultMessage = data.message || '영상 생성 완료!';
                    }
                    
                    progressBar.style.width = '100%';
                    btn.disabled = false;
                    btn.textContent = '영상 생성하기';
                    
                    // 결과 표시
                    if (data.result && data.result.videos) {
                        setTimeout(() => {
                            let message = '영상이 생성되었습니다!\n저장 위치: ' + data.result.videos[0];
                            if (resultMessage) {
                                message += '\n\n' + resultMessage;
                            }
                            alert(message);
                        }, 500);
                    }
                } else if (data.status === 'failed') {
                    clearInterval(checkInterval);
                    status.className = 'status show error';
                    // message 또는 error 필드에서 에러 메시지 가져오기
                    const errorMessage = data.message || data.error || '알 수 없는 오류';
                    statusText.textContent = errorMessage;
                    btn.disabled = false;
                    btn.textContent = '영상 생성하기';
                }
            } catch (error) {
                console.error('진행상황 체크 오류:', error);
            }
        }
    </script>

</body>
</html>
